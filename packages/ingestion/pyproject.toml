[project]
name = "indusense-ingestion"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["pandas>=3.1.1", "pyyaml>=6.0.3", "sqlglot>=30.33.0", "jsonschema>=4.23,<5", "typer>=0.16,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.17,<2"]

[project.scripts]
indusense = "indusense_ingestion.cli:app"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
