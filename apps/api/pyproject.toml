[project]
name = "indusense-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "indusense-ingestion",
    "fastapi>=0.165,<1",
    "uvicorn>=0.38,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.17,<2",
    "prometheus-client>=0.23,<1",
    "python-multipart>=0.0.20,<1",
]

[tool.uv.sources]
indusense-ingestion = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
