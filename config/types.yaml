version: 1
types:
  # Types de columns[].type dans le schéma Bronze v2.
  IDENTIFIER:
    converter: string
    statistics: []
  NUMBER:
    converter: number
    statistics: [min, max, mean, median]
  BINARY:
    converter: binary
    statistics: []
  TEXT:
    converter: string
    statistics: []
  INTEGER:
    converter: integer
    statistics: [min, max, mean, median]
  DECIMAL:
    converter: decimal
    statistics: [min, max, mean, median]
  BOOLEAN:
    converter: boolean
    statistics: []
  DATE:
    converter: datetime
    format: "%Y-%m-%d"
    pattern: '\d{4}-\d{2}-\d{2}'
    statistics: [min, max]
  TIME:
    converter: datetime
    format: "%H:%M"
    pattern: '\d{2}:\d{2}'
    statistics: [min, max]
  TIMESTAMP:
    converter: datetime
    format: "%Y-%m-%d %H:%M:%S"
    pattern: '\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
    statistics: [min, max]
  TIMESTAMPTZ:
    converter: datetime_utc
    format: "%Y-%m-%d %H:%M:%S%z"
    statistics: [min, max]
